<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FeedMe — Production Blueprint</title>
<style>
:root{color-scheme:light;--bg:#fff9ef;--paper:#fff;--ink:#1e3328;--muted:#52604d;--line:#d9ded0;--accent:#b93e20;--lime:#d5e87b;--soft:#edf0e5;--code:#f4f5f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.55;cursor:default}a{color:var(--accent);text-underline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #537b34;outline-offset:3px}button{border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:9px 13px;min-height:42px}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.ghost{background:transparent;border-color:transparent}button.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}h1,h2,h3,h4{line-height:1.2}h1{font-size:34px;letter-spacing:-1px;font-weight:600;margin:0 0 12px}h2{font-size:24px;font-weight:600;margin:28px 0 12px}h3{font-size:18px;margin:24px 0 10px}p{margin:10px 0 16px}small,.small{font-size:12px}.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.layout{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:26px 18px;position:sticky;top:0;height:100vh;overflow:auto;background:#f8f4e9}.brand{font-size:27px;letter-spacing:-1.5px;font-weight:650;display:flex;gap:8px;align-items:center}.brand-dot{display:grid;place-items:center;border-radius:50%;width:31px;height:31px;background:var(--accent);color:white;font-size:14px;letter-spacing:-1px}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:11px;font-weight:600;color:var(--muted)}.sidebar nav{display:grid;gap:5px;margin:28px 0}.sidebar nav button{text-align:left;border-color:transparent;background:transparent}.sidebar nav button.active{background:var(--ink);color:var(--bg)}.side-foot{font-size:12px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted)}.main{min-width:0;padding:28px 34px 70px;max-width:1600px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:26px}.badge{display:inline-block;border:1px solid var(--line);border-radius:20px;font-size:11px;padding:3px 8px;white-space:nowrap}.hero{max-width:850px;margin:35px 0}.hero h1{font-family:Georgia,serif;font-size:52px;font-weight:400;max-width:680px}.hero em{color:var(--accent);font-style:normal}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}.panel h3{margin-top:0}.metrics{margin:22px 0}.metric{font-size:31px;letter-spacing:-1px;margin:4px 0}.tile{display:block;text-align:left;width:100%;height:100%}.tile .eyebrow{display:block;margin-bottom:10px}.tile-title{font-size:18px;font-weight:600;display:block}.field{display:grid;gap:6px;font-size:13px;margin:12px 0}.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 12px;border-radius:9px;font-size:16px}.field textarea{min-height:84px;resize:vertical}.field.check{display:flex;align-items:center;gap:9px}.field.check input{width:18px;height:18px}.toolbar{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin:18px 0}.toolbar .field{flex:1;min-width:175px;margin:0}.toolbar button{flex:none}.catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.catalog button{text-align:left}.doc{max-width:1050px}.doc p,.doc li{max-width:100ch}.doc ul,.doc ol{padding-left:24px}.doc li{margin:7px 0}.doc pre,pre{background:var(--code);padding:16px;border-radius:10px;font-size:12px;overflow:auto;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.doc code,code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em;overflow-wrap:anywhere}.doc table,table{border-collapse:collapse;width:100%;font-size:13px}.doc th,.doc td,th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}.doc th,th{background:var(--soft);font-weight:600}.table-wrap{overflow:auto;max-width:100%}.doc blockquote{margin:18px 0;border-left:3px solid var(--accent);padding:5px 20px;background:var(--soft)}.doc hr{border:0;border-top:1px solid var(--line);margin:24px 0}.split{display:grid;grid-template-columns:minmax(300px,440px) minmax(320px,1fr);gap:24px;align-items:start}.phone{background:var(--bg);border:1px solid #b9c5b5;border-radius:27px;overflow:hidden;max-width:430px;margin:0 auto;width:100%}.phone.staff{max-width:560px}.phone-header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.phone-body{padding:22px 20px}.phone-title{font-family:Georgia,serif;font-size:29px;font-weight:400;line-height:1.12;margin:0 0 20px;letter-spacing:-.6px}.phone-copy{font-size:13px;color:var(--muted)}.phone-actions{display:grid;gap:8px;margin-top:18px}.phone-actions button{text-align:left;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}.phone-actions button .badge{font-size:9px;background:transparent;white-space:normal}.phone-nav{display:flex;border-top:1px solid var(--line);padding:5px;background:var(--paper);gap:1px}.phone-nav button{flex:1;border:0;background:transparent;padding:7px 2px;font-size:10px;min-width:0}.phone-nav button.active{color:var(--accent);background:var(--soft)}.illustration{background:var(--soft);border-radius:16px;padding:20px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;margin:16px 0}.illustration .dish{font-family:Georgia,serif;font-style:italic;font-size:32px;letter-spacing:-1px;color:var(--accent)}.trace{border-left:3px solid var(--accent);padding:13px 17px;background:var(--paper);margin-bottom:16px;border-radius:0 12px 12px 0}.trace.error{border-color:#a33535}.trace h3{margin:0 0 7px}.trace p{font-size:13px;margin:7px 0}.inspector{display:grid;gap:14px}.inspector .panel{padding:17px}.detail-key{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:13px 0 4px}.detail-value{font-size:13px;overflow-wrap:anywhere}.link-button{padding:0;border:0;min-height:24px;background:none;color:var(--accent);text-decoration:underline;text-align:left}.map-window{border:1px solid var(--line);border-radius:14px;background:#fbfaf6;overflow:auto;max-height:72vh}.map-window svg{display:block;max-width:none}.screen-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:7px;margin:15px 0}.screen-list button{font-size:12px;text-align:left}.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin:18px 0}.flow .node{flex:1;min-width:160px;border:1px solid var(--line);background:var(--paper);padding:15px;border-radius:12px;font-size:13px}.flow .arrow{align-self:center;color:var(--accent)}.flow .node strong{display:block;margin-bottom:7px}.notice{background:var(--soft);border-radius:12px;padding:14px 17px;font-size:13px;margin:16px 0}.success{color:#315e32}.error-text{color:#a33535}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.breadcrumb{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.footer-meta{margin-top:24px;font-size:11px;color:var(--muted)}details{border-bottom:1px solid var(--line);padding:10px 0}summary{cursor:pointer}.form-error{font-size:12px;color:#a33535;margin:10px 0}#live{min-height:20px;font-size:12px;color:var(--muted)}
@media(max-width:1050px){.main{padding:24px}.layout{grid-template-columns:190px minmax(0,1fr)}.sidebar{padding:22px 12px}.split{grid-template-columns:1fr}.phone{max-width:440px}.hero h1{font-size:43px}}@media(max-width:700px){.layout{display:block}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:15px 18px}.sidebar nav{display:flex;overflow:auto;margin:15px 0 0;padding-bottom:5px}.sidebar nav button{white-space:nowrap;font-size:12px;flex:none}.side-foot{display:none}.main{padding:20px 16px 50px}.hero{margin:22px 0}.hero h1{font-size:37px}.topline{margin-bottom:18px}.metrics{grid-template-columns:1fr 1fr}.metric{font-size:28px}.phone-body{padding:20px 16px}.toolbar{align-items:stretch}.toolbar .field{min-width:100%}.panel{padding:16px}.doc table{font-size:12px}.map-window{max-height:65vh}h1{font-size:28px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .12s,color .12s}button:hover{filter:brightness(.97)}}
</style>
</head>
<body>
<div class="layout"><aside class="sidebar"><div class="brand"><span class="brand-dot">fm</span>FeedMe</div><div class="eyebrow" style="margin-top:8px">Production blueprint</div><nav id="nav" aria-label="Blueprint sections"></nav><div class="side-foot">Android + iOS<br>Shared Kotlin foundation<br><br>All interactions here use synthetic data. No account, post, purchase or backend request is created.</div></aside><main class="main"><div class="topline"><span class="breadcrumb" id="breadcrumb">FeedMe / Overview</span><span class="badge">Design specification · 13 Sep 2026</span></div><div id="view"></div><div id="live" aria-live="polite" role="status"></div></main></div>
<script id="blueprint-data" type="application/json">__FEEDME_DATA__</script>
<script>
(()=>{
const D=JSON.parse(document.getElementById('blueprint-data').textContent),V=document.getElementById('view'),live=document.getElementById('live');
const state={view:'overview',screen:D.product.start,role:'public',scenario:'success',conditional:false,picker:null,pending:null,mode:'draft',trace:null,history:[],drafts:{},group:'All',zoom:75,featureSearch:'',doc:null};
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const screen=id=>D.screens.find(s=>s.id===id),operation=r=>D.operations.find(o=>o.request===r);
const menus=[['overview','Start here'],['features','Feature plans'],['screens','Screen mind map'],['walk','Click-through'],['architecture','Architecture'],['ledger','Button ledger'],['documents','Design & delivery'],['api','API contract'],['verify','Verification']];
const btn=(label,attrs='',cls='')=>'<button type="button" class="'+cls+'" '+attrs+'>'+label+'</button>';
const docById=id=>D.documents.find(d=>d.id===id);
function inline(t){let s=esc(t);s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,label,url)=>{let raw=url.replaceAll('&amp;','&');if(/^(https?:|\/|[a-zA-Z0-9_.-])/.test(raw)&&!/^javascript:/i.test(raw))return '<a href="'+esc(raw)+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';return label;});return s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');}
function markdown(text){const lines=text.split('\n');let out='',code=false,buf=[],list=false,table=false;const end=()=>{if(list){out+='</ul>';list=false;}if(table){out+='</tbody></table></div>';table=false;}};for(let i=0;i<lines.length;i++){let line=lines[i];if(line.startsWith('```')){end();if(code){out+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>';buf=[];}code=!code;continue;}if(code){buf.push(line);continue;}if(!line.trim()){end();continue;}if(/^\|/.test(line)){if(/^\|\s*:?-/.test(line))continue;const cells=line.split('|').slice(1,-1);if(!table){if(list){out+='</ul>';list=false;}out+='<div class="table-wrap"><table><thead><tr>'+cells.map(c=>'<th>'+inline(c.trim())+'</th>').join('')+'</tr></thead><tbody>';table=true;}else out+='<tr>'+cells.map(c=>'<td>'+inline(c.trim())+'</td>').join('')+'</tr>';continue;}if(table){out+='</tbody></table></div>';table=false;}const h=line.match(/^(#{1,6})\s+(.*)/);if(h){end();let n=Math.min(h[1].length,4);out+='<h'+n+'>'+inline(h[2])+'</h'+n+'>';continue;}if(/^\s*[-*]\s+|^\d+\.\s+/.test(line)){if(!list){out+='<ul>';list=true;}out+='<li>'+inline(line.replace(/^\s*[-*]\s+|^\d+\.\s+/,''))+'</li>';continue;}if(list){out+='</ul>';list=false;}if(line.startsWith('>'))out+='<blockquote>'+inline(line.replace(/^>\s?/,''))+'</blockquote>';else if(/^---+$/.test(line))out+='<hr>';else out+='<p>'+inline(line)+'</p>';}end();if(code)out+='<pre>'+esc(buf.join('\n'))+'</pre>';return out;}
function setView(view){state.view=view;state.doc=null;render();}
function go(id,{browse=false}={}){if(!screen(id))return;state.history.push(state.screen);state.screen=id;state.view='walk';if(browse){state.role=screen(id).auth==='staff'?'staff':screen(id).auth==='public'?'public':'member';state.trace=null;state.mode='draft';state.picker=null;state.pending=null;}render();}
function overview(){return '<div class="hero"><div class="eyebrow">From first signup to the next shared meal</div><h1>A complete plan for<br><em>every FeedMe moment.</em></h1><p>Trace a feature from its product strategy to its screen, button, production API, data and release gates. The maps and explorer use the same canonical registry.</p><div class="row">'+btn('Start at login / signup','data-start','primary')+btn('Explore every screen','data-view="screens"')+'</div></div><div class="grid metrics">'+[[D.features.length,'Feature plans'],[D.screens.length,'Screens & operational surfaces'],[D.screens.reduce((n,s)=>n+s.actions.length,0),'Button bindings, including shared tabs'],[D.operations.length,'API operations']].map(([n,l])=>'<div class="panel"><div class="metric">'+n+'</div><div class="small muted">'+l+'</div></div>').join('')+'</div><div class="grid">'+[['features','Feature by feature','Strategy, screen design, production sequence, contracts, failures, execution and release tests.'],['screens','Every screen connected','A full mind map and the exact route out of each user action.'],['architecture','Screen to system','Client modules, API ownership, data, workers and external providers.'],['documents','Ready for implementation','Kotlin architecture, rollout slices, design system, operations and integration guide.']].map(([id,t,copy])=>'<button class="panel tile" data-view="'+id+'"><span class="eyebrow">'+id+'</span><span class="tile-title">'+t+'</span><p class="small muted">'+copy+'</p></button>').join('')+'</div><div class="notice">This is an implementation blueprint and simulated navigation prototype. Native-device, backend, professional-content-review, security and load-test gates are documented; they have not been executed as a live FeedMe service.</div>';}
function featuresView(){if(state.doc){const d=docById(state.doc);return btn('← All feature plans','data-view="features"')+'<article class="doc">'+markdown(d?.text||'Document unavailable.')+'</article>';}const filtered=D.features.filter(f=>(f.id+' '+f.title).toLowerCase().includes(state.featureSearch.toLowerCase()));return '<h1>Every feature has an execution plan.</h1><p class="muted">P1 is the initial production scope; P2 and P3 retain complete specifications for later integration.</p><label class="field">Find a feature<input id="feature-search" value="'+esc(state.featureSearch)+'" placeholder="Make Mine, privacy, payments…"></label><div class="catalog">'+filtered.map(f=>'<button data-doc="'+f.id+'"><span class="eyebrow">'+f.id+' · '+f.phase+'</span><span class="tile-title">'+esc(f.title)+'</span><p class="small muted">'+f.screenIds.length+' screens · '+f.operationIds.length+' API operations</p></button>').join('')+'</div>';}
function selector(){return '<label class="field">Screen<select id="screen-select">'+D.groups.map(g=>'<optgroup label="'+esc(g)+'">'+D.screens.filter(s=>s.group===g).map(s=>'<option value="'+s.id+'" '+(s.id===state.screen?'selected':'')+'>'+s.id+' · '+esc(s.title)+'</option>').join('')+'</optgroup>').join('')+'</select></label>';}
function screenMap(){const group=state.group,items=D.screens.filter(s=>group==='All'||s.group===group);return '<h1>All screens, from the first hello.</h1><p class="muted">Choose a screen to inspect its design and click every action. Staff tools are separately authenticated operational surfaces.</p><div class="toolbar"><label class="field">Screen group<select id="group-select"><option>All</option>'+D.groups.map(g=>'<option '+(g===group?'selected':'')+'>'+esc(g)+'</option>').join('')+'</select></label><label class="field">Map scale<select id="zoom-select">'+[50,75,100,125].map(z=>'<option value="'+z+'" '+(z===state.zoom?'selected':'')+'>'+z+'%</option>').join('')+'</select></label>'+btn('Start signup flow','data-start','primary')+'</div>'+(group==='All'?'<div class="map-window">'+D.diagrams.mindmap+'</div>':'<div class="flow"><div class="node"><strong>FeedMe</strong>AUTH_WELCOME</div><span class="arrow">→</span><div class="node"><strong>'+esc(group)+'</strong>'+items.length+' screens</div></div>')+'<div class="screen-list">'+items.map(s=>btn('<span class="mono">'+s.id+'</span><br>'+esc(s.title),'data-screen="'+s.id+'"')).join('')+'</div><p class="small"><a href="maps/all_screens_mindmap.svg">Open the full SVG</a> · <a href="maps/all_screens_mindmap.mmd">Mermaid source</a> · <a href="maps/all_button_navigation.mmd">Every button transition</a></p>';}
function fieldHTML(f,s){const val=state.drafts[s.id]?.[f.id]??f.example;let base='data-field="'+f.id+'"';if(f.type==='checkbox')return '<label class="field check"><input type="checkbox" '+base+' '+((val===true||val==='true')?'checked':'')+'>'+esc(f.label)+(f.required?' *':'')+'</label>';if(f.type==='select')return '<label class="field">'+esc(f.label)+(f.required?' *':'')+'<select '+base+'>'+f.options.map(o=>'<option '+(o===val?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select></label>';if(f.type==='textarea')return '<label class="field">'+esc(f.label)+(f.required?' *':'')+'<textarea '+base+'>'+esc(val)+'</textarea></label>';return '<label class="field">'+esc(f.label)+(f.required?' *':'')+'<input type="'+esc(f.type)+'" '+base+' value="'+esc(val)+'" '+(f.type==='password'?'autocomplete="off"':'')+'></label>';}
function visible(a){if(!a.visibility)return true;if(state.conditional)return true;if(a.visibility.includes('picker'))return !!state.picker;if(a.visibility.includes('editPost'))return state.mode==='editPost';if(a.visibility.includes('settings'))return state.mode==='settings';if(a.visibility.includes('fulfillRequest confirmed'))return state.mode==='fulfillRequest'&&state.responseConfirmed;if(a.visibility.includes('fulfillRequest'))return state.mode==='fulfillRequest';if(a.visibility.includes('requester'))return state.mode==='requester';if(a.visibility.includes('publishing mode'))return ['draft','editPost'].includes(state.mode);if(a.visibility.includes('draft mode'))return !state.mode||state.mode==='draft';if(a.visibility.includes('offline'))return state.scenario==='offline';return false;}
function fixtures(s){if(['POST','STORY','PROFILE_PLATE','TODAY'].includes(s.id))return '<div class="illustration"><span class="small">Meera · Weeknight crew</span><span class="dish">Made this work.</span><span class="small muted">Food-photo area · synthetic design fixture</span></div>';if(['RECIPE','VARIANT','RECOMMENDATIONS','COOK','MEAL_DONE'].includes(s.id))return '<div class="illustration"><span class="eyebrow">Illustrative meal fixture</span><span class="dish">Your kind of wrap.</span><span class="small">Ingredients, preparation and source details occupy this area.</span></div>';if(s.id==='AUTH_WELCOME')return '<p class="phone-copy">Your kitchen. Your people. Your next meal.</p>';return '';}
function walk(){const s=screen(state.screen),own=s.actions.filter(a=>a.scope==='screen'&&visible(a)),back=s.actions.find(a=>a.scope==='back'),nav=s.actions.filter(a=>a.scope==='navigation');return '<div class="toolbar">'+selector()+'<label class="field">Scenario<select id="scenario-select">'+[['success','Success'],['invalid','Invalid input'],['offline','Offline'],['expired','Session expired'],['forbidden','Permission denied'],['conflict','Concurrent change'],['pending','Pending processing'],['unavailable','Expired / unavailable']].map(([k,l])=>'<option value="'+k+'" '+(state.scenario===k?'selected':'')+'>'+l+'</option>').join('')+'</select></label><label class="field">Actor<select id="role-select">'+['public','guest','member','staff'].map(r=>'<option '+(r===state.role?'selected':'')+'>'+r+'</option>').join('')+'</select></label></div><label class="field check"><input id="conditional" type="checkbox" '+(state.conditional?'checked':'')+'>Show conditional controls for design review</label><div class="split"><section class="phone '+(s.auth==='staff'?'staff':'')+'" aria-label="Simulated '+esc(s.title)+' screen"><div class="phone-header">'+(back?btn('←','data-action="'+back.id+'" aria-label="Back"','ghost'):'<span class="brand-dot">fm</span>')+'<span class="small">'+(s.auth==='staff'?'FeedMe operations':'FeedMe')+'</span><span class="badge">'+s.phase+'</span></div><div class="phone-body"><h2 class="phone-title">'+esc(s.title)+'</h2>'+fixtures(s)+s.fields.map(f=>fieldHTML(f,s)).join('')+'<div id="form-error" class="form-error" role="alert"></div><div class="phone-actions">'+own.map((a,i)=>btn(esc(a.label)+(a.visibility?'<span class="badge">Conditional</span>':''),'data-action="'+a.id+'"',i===0?'primary':'')).join('')+'</div></div>'+(nav.length?'<nav class="phone-nav" aria-label="App tabs">'+nav.map(a=>btn(esc(a.label),'data-action="'+a.id+'"',a.target===s.id?'active':'')).join('')+'</nav>':'')+'</section><aside class="inspector">'+traceHTML()+'<div class="panel"><div class="eyebrow">'+s.id+' · '+esc(s.group)+'</div><h2 style="margin-top:10px">'+esc(s.title)+'</h2><p class="small">'+esc(s.description)+'</p><div class="detail-key">Production owner</div><div class="detail-value">'+esc(D.modules[s.module].label)+' · '+esc(s.auth)+'</div><div class="detail-key">Data loaded on entry</div><div class="detail-value">'+s.hydration.map(x=>'<div><code>'+esc(x.request)+'</code></div>').join('')+'</div><div class="detail-key">Context and return rules</div><div class="detail-value">'+esc(s.contextRules)+'</div><div class="detail-key">Feature plans</div><div class="row">'+s.features.map(f=>btn(f,'data-doc="'+f+'"')).join('')+'</div><p class="small"><a href="screens/'+s.id+'.md">Full screen specification</a></p></div><div class="panel"><h3>Where this screen leads</h3><div class="row">'+[...new Set(s.actions.flatMap(a=>[a.target,...(a.branches||[]).map(b=>b[0])]).filter(Boolean))].map(id=>btn(esc(screen(id)?.title||id),'data-screen="'+id+'"')).join('')+'</div></div></aside></div><p class="footer-meta">Every control above is a simulated intent. External sign-in, camera, share sheets and purchases are described rather than invoked.</p>';}
function traceHTML(){const t=state.trace;if(!t)return '<div class="trace"><h3>Click a button to trace it.</h3><p>See the command, next screen, permission checks, production side effects and failure behavior here.</p></div>';const a=t.action;return '<div class="trace '+(t.ok?'':'error')+'"><div class="eyebrow">Simulated '+esc(t.status)+'</div><h3>'+esc(a.label)+'</h3><p>'+esc(t.message)+'</p><div class="detail-key">Action ID / operation</div><div class="detail-value mono">'+esc(a.id)+'<br>'+esc(a.request)+(a.operationId?'<br>'+esc(a.operationId):'')+'</div><div class="detail-key">Production effect</div><div class="detail-value">'+esc(a.effect)+'</div><div class="detail-key">Guard</div><div class="detail-value">'+esc(a.guard||'Context-bound originating command authorization.')+'</div><div class="detail-key">Failure recovery</div><div class="detail-value">'+esc(a.errors||'Use the originating command’s typed errors.')+'</div><div class="detail-key">Offline behavior</div><div class="detail-value">'+esc(a.offline||'Use the originating command’s offline policy.')+'</div><div class="detail-key">Replay / concurrency</div><div class="detail-value">'+esc(a.idempotency||'Preserve originating operation ID.')+'</div>'+(a.branches?.length?'<div class="detail-key">Conditional routes</div>'+a.branches.map(([id,why])=>'<p class="small">'+btn(esc(id),'data-screen="'+id+'"','link-button')+' · '+esc(why)+'</p>').join(''):'')+'</div>';}
function runAction(a,confirmed=false){const origin=screen(state.screen);if(a.request==='LOCAL dispatchPendingCommand'){if(!state.pending){state.trace={action:a,ok:false,status:'missing context',message:'No originating command. Return to the screen that requested confirmation.'};render();return;}const p=state.pending;state.pending=null;state.screen=p.screen;runAction(p.action,true);return;}if(a.request==='LOCAL cancelPendingCommand'){state.screen=state.pending?.screen||state.history.at(-1)||'HOME';state.pending=null;render();return;}
 if(a.scope==='back'&&state.picker){state.screen=state.picker.cancelTo||state.picker.origin;state.picker=null;render();return;}if(a.scope==='back'&&origin.id==='CONFIRM_ACTION'){state.screen=state.pending?.screen||'HOME';state.pending=null;render();return;}
 if(a.request==='LOCAL pickerResult'||a.request==='LOCAL pickerCancel'){const p=state.picker,cancel=a.request==='LOCAL pickerCancel',destination=p?(cancel?p.cancelTo||p.origin:p.returnTo):null;state.picker=null;state.trace={action:a,ok:!!p,status:p?'picker return':'missing picker',message:p?'Returned to '+destination+'; '+(cancel?'previous draft retained.':'selected reference copied into that draft.'):'This control is only active when a picker has an originating draft.'};if(destination)state.screen=destination;render();return;}
 const network=/^(GET|POST|PATCH|PUT|DELETE|EXTERNAL) /.test(a.request),write=/^(POST|PATCH|PUT|DELETE) /.test(a.request);
 let err='';if(a.validate){const values=Object.fromEntries(origin.fields.map(f=>[f.id,state.drafts[origin.id]?.[f.id]??f.example]));for(const f of origin.fields){const v=values[f.id];if(f.required&&(f.type==='checkbox'?![true,'true'].includes(v):!String(v).trim()))err='Complete the required fields before continuing.';if(f.type==='email'&&v&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))err='Enter an email address in a valid format.';if(f.type==='number'&&v!==''&&Number(v)<=0)err='Enter a positive amount.';}if(values.confirm!==undefined&&values.password!==values.confirm&&origin.fields.some(f=>f.id==='password'))err='The password confirmation must match.';}
 if(state.scenario==='invalid'&&network)err='Simulated 422: correct the field error. Your non-secret draft is retained.';
 if(origin.id==='DELETE_ACCOUNT'&&a.validate&&(state.drafts[origin.id]?.confirmText||'')!=='DELETE')err='Type DELETE exactly to confirm this request.';
 if(err){state.trace={action:a,ok:false,status:'validation error',message:err};render();document.getElementById('form-error').textContent=err;return;}
 if(network&&a.auth==='staff'&&state.role!=='staff'){state.trace={action:a,ok:false,status:'staff authentication required',message:'Member identities cannot run staff commands. Continue through the separate staff login.'};state.screen='ADMIN_LOGIN';render();return;}
 if(network&&a.auth==='member'&&state.role!=='member'){state.trace={action:a,ok:false,status:'sign-in required',message:'A member identity is required; staff access does not substitute for a member account. The intended action/draft is retained for authorized resumption.'};state.returnAfterAuth=origin.id;state.screen='AUTH_LOGIN';render();return;}
 if(network&&['expired','forbidden','conflict','unavailable'].includes(state.scenario)){const messages={expired:'Simulated 401: reauthenticate and recheck this resource before resuming.',forbidden:'Simulated 403/404: access is not available; do not disclose private resource details.',conflict:'Simulated 409/412: reload the current revision and let the user review the change.',unavailable:'Simulated expired/removed/recalled resource: stop this action and offer a safe alternative.'};state.trace={action:a,ok:false,status:state.scenario,message:messages[state.scenario]};if(state.scenario==='expired'){state.returnAfterAuth=origin.id;state.screen='AUTH_LOGIN';}else if(['forbidden','unavailable'].includes(state.scenario))state.screen='UNAVAILABLE';render();return;}
 if(state.scenario==='offline'&&network){const local=/Available locally|Queue private|Allowed for previously/.test(a.offline||'');state.trace={action:a,ok:local,status:local?'local / queued':'offline',message:local?'Applied only to eligible local private state; remote acknowledgement remains pending.':'No remote success is claimed. Input remains available for a deliberate online retry.'};if(local&&a.target)state.screen=a.target;render();return;}
 if(state.scenario==='pending'&&network){state.trace={action:a,ok:true,status:'pending',message:'The server/provider receipt remains pending. Stay in a processing state and query/retry with the same operation identity.'};if(a.target==='POST'||a.target==='PUBLISH_STATUS')state.screen='PUBLISH_STATUS';else if(a.request.includes('purchase')||a.request.includes('entitlements'))state.screen='PURCHASE_STATUS';render();return;}
 if(a.confirm&&!confirmed){state.pending={screen:origin.id,action:a};state.trace={action:a,ok:true,status:'confirmation required',message:'Review the exact change. Nothing has been written yet.'};state.screen='CONFIRM_ACTION';render();return;}
 if(a.picker)state.picker={...a.picker,origin:origin.id,cancelTo:a.picker.cancelTo||origin.id};if(a.mode)state.mode=a.mode;if(a.responseConfirmed!==undefined)state.responseConfirmed=a.responseConfirmed;if(a.clearMode){state.mode='draft';state.responseConfirmed=false;}if(a.scope==='navigation'){state.mode='draft';state.picker=null;}
 if(a.request==='POST /v1/guest-sessions')state.role='guest';if(a.request.includes('signIn')||a.request.includes('confirmSignUp')||a.request.includes('exchangeCodePKCE'))state.role='member';if(a.request.includes('WorkforceOIDC'))state.role='staff';if(a.request.includes('signOut')||a.request.includes('revoke-all')||a.request==='POST /v1/account/deletion')state.role='public';
 state.trace={action:a,ok:true,status:network?'successful receipt':'local action',message:network?'Simulation only: a valid authorized receipt would produce the documented effect. No real network or external application was contacted.':a.effect};
 let target=a.target;if(state.picker&&['Apply choice','Apply to this meal','Save kitchen setup'].includes(a.label)){target=state.picker.returnTo;state.picker=null;}
 if(state.returnAfterAuth&&state.role==='member'&&['AUTH_LOGIN','AUTH_CALLBACK','AUTH_VERIFY'].includes(origin.id)){target=state.returnAfterAuth;state.returnAfterAuth=null;}
 if(target&&screen(target)){if(a.scope==='back'&&state.history.length)target=state.history.pop();else state.history.push(origin.id);const next=screen(target);if(next.auth==='member'&&state.role!=='member'){state.returnAfterAuth=target;target='AUTH_LOGIN';state.trace.status='sign-in required';state.trace.ok=false;state.trace.message='The destination requires an authenticated member. Private data is not loaded; the destination is retained for sign-in.';}else if(next.auth==='staff'&&next.id!=='ADMIN_LOGIN'&&state.role!=='staff'){target='ADMIN_LOGIN';state.trace.status='staff authentication required';state.trace.ok=false;}state.screen=target;}
 render();live.textContent=a.label+': '+state.trace.status+'. '+(target?'Opened '+screen(state.screen).title+'.':'');
}
function architectureView(){const s=screen(state.screen),m=D.modules[s.module];return '<h1>From a screen to production.</h1><p class="muted">Each screen maps to a client boundary, authorized API module and owned data. The full map includes every registered screen.</p><div class="toolbar">'+selector()+btn('Open this screen','data-screen="'+s.id+'"','primary')+'</div><div class="flow">'+[['Screen',s.id+' · '+s.title],['Client',s.auth==='staff'?'Workforce web UI + typed admin client':'Kotlin ViewModel → use case → repository'],['API module',m.label+' · server authorization'],['Data / effects',m.data+' · transactional outbox']].map(([t,d],i)=>(i?'<span class="arrow">→</span>':'')+'<div class="node"><strong>'+esc(t)+'</strong>'+esc(d)+'</div>').join('')+'</div><div class="grid"><div class="panel"><h3>Entry requests</h3>'+s.loads.map(r=>'<p class="mono">'+esc(r)+'</p>').join('')+'</div><div class="panel"><h3>Button operations</h3>'+[...new Set(s.actions.filter(a=>a.operationId).map(a=>a.request))].map(r=>'<p class="mono">'+esc(r)+'</p>').join('')+'</div></div><h2>All screens → architecture</h2><div class="map-window">'+D.diagrams.architecture+'</div><p class="small"><a href="maps/all_screens_architecture.svg">Full architectural SVG</a> · <a href="maps/all_screens_architecture.mmd">Mermaid source</a></p><div class="notice">Shared cross-cutting services: managed identity, native browser/camera/timer/store adapters, private media processing, APNs/FCM delivery, RevenueCat reconciliation, reviewed content and traceable operations. The full production topology is in the architecture document.</div>'+btn('Read system architecture','data-doc="D1"');}
function ledger(){const s=screen(state.screen);return '<h1>Every button has a contract.</h1><div class="toolbar">'+selector()+btn('Try these buttons','data-screen="'+s.id+'"','primary')+'</div><div class="table-wrap"><table><thead><tr><th>Button / ID</th><th>Command</th><th>Destination</th><th>Production result</th></tr></thead><tbody>'+s.actions.map(a=>'<tr><td><strong>'+esc(a.label)+'</strong><br><span class="mono">'+a.id+'</span>'+(a.visibility?'<p class="small">'+esc(a.visibility)+'</p>':'')+'</td><td><code>'+esc(a.request)+'</code><br><span class="small">'+esc(a.operationId||'Local/native contract')+'</span></td><td>'+(a.target?btn(esc(a.target),'data-screen="'+a.target+'"','link-button'):'Stay / context')+(a.confirm?'<p class="small">Confirmation sheet first</p>':'')+(a.branches||[]).map(([id,w])=>'<p class="small">'+esc(id)+' — '+esc(w)+'</p>').join('')+'</td><td>'+esc(a.effect)+'<details><summary>Permissions, failure and offline</summary><p>'+esc(a.guard)+'</p><p>'+esc(a.errors)+'</p><p>'+esc(a.offline)+'</p></details></td></tr>').join('')+'</tbody></table></div><p><a href="registry/button_actions.csv">Download the complete button ledger CSV</a> · <a href="registry/screen_registry.json">Screen registry JSON</a></p>';}
function documentsView(){if(state.doc){const d=docById(state.doc);return btn('← Design & delivery','data-view="documents"')+'<article class="doc">'+markdown(d?.text||'Document unavailable.')+'</article>';}return '<h1>Design, architecture and execution.</h1><div class="catalog">'+D.documents.filter(d=>d.id.startsWith('D')).map(d=>'<button data-doc="'+d.id+'"><span class="tile-title">'+esc(d.title)+'</span><p class="small muted">'+esc(d.file)+'</p></button>').join('')+'</div><h2>Portable artifacts</h2><p><a href="README.md">Package guide</a> · <a href="07_Screens_and_Interactions.md">Every screen specification</a> · <a href="registry/feature_traceability.csv">Feature traceability</a></p>';}
function apiView(){return '<h1>Typed production API.</h1><p class="muted">OpenAPI '+esc(D.api.openapi)+' · '+D.operations.length+' operations. These are proposed contracts, not live endpoints.</p><p><a href="architecture/04_API_Contract.json">Open or download full OpenAPI JSON</a></p>'+D.operations.map(o=>'<details><summary><span class="mono">'+esc(o.request)+'</span> — '+esc(o.summary)+'</summary><p><strong>'+esc(o.operationId)+'</strong> · '+esc(o['x-module']||'')+'</p><p>'+esc(o.description)+'</p><pre>'+esc(JSON.stringify({requestBody:o.requestBody,parameters:o.parameters,security:o.security,responses:o.responses},null,2))+'</pre></details>').join('');}
function verificationView(){const r=D.verification;return '<h1>Coverage and verification.</h1><p>The structural checks validate the specification package and the simulated navigation graph. Production backend, native-device and operational release tests remain in the execution gates.</p>'+(r?'<div class="grid metrics">'+Object.entries(r.counts||{}).slice(0,6).map(([k,n])=>'<div class="panel"><div class="metric">'+esc(n)+'</div><div class="small">'+esc(k)+'</div></div>').join('')+'</div><div class="notice '+(r.passed?'success':'error-text')+'">'+(r.passed?'Structural checks passed.':'Unresolved checks require attention.')+'</div><pre>'+esc(JSON.stringify(r,null,2))+'</pre>':'<div class="notice">The validation receipt is generated after the first build and embedded on rebuild.</div>')+'<p><a href="verification/report.md">Verification report</a></p>';}
function render(){document.getElementById('nav').innerHTML=menus.map(([id,t])=>btn(t,'data-view="'+id+'"',state.view===id?'active':'')).join('');document.getElementById('breadcrumb').textContent='FeedMe / '+(menus.find(x=>x[0]===state.view)?.[1]||'Blueprint')+(state.view==='walk'?' / '+state.screen:'');V.innerHTML=state.view==='overview'?overview():state.view==='features'?featuresView():state.view==='screens'?screenMap():state.view==='walk'?walk():state.view==='architecture'?architectureView():state.view==='ledger'?ledger():state.view==='documents'?documentsView():state.view==='api'?apiView():verificationView();document.querySelectorAll('.map-window svg').forEach(svg=>{svg.style.width=(Number(svg.getAttribute('width'))*state.zoom/100)+'px';svg.style.height='auto';});}
document.addEventListener('click',e=>{const el=e.target.closest('[data-view],[data-start],[data-screen],[data-doc],[data-action]');if(!el)return;e.preventDefault();if(el.hasAttribute('data-start')){state.screen='AUTH_WELCOME';state.role='public';state.scenario='success';state.trace=null;state.history=[];state.picker=null;state.pending=null;state.view='walk';render();}else if(el.dataset.view)setView(el.dataset.view);else if(el.dataset.screen)go(el.dataset.screen,{browse:true});else if(el.dataset.doc){state.doc=el.dataset.doc;state.view=state.doc.startsWith('F')?'features':'documents';render();}else if(el.dataset.action){const a=screen(state.screen).actions.find(a=>a.id===el.dataset.action);if(a)runAction(a);}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='screen-select'){state.screen=el.value;state.trace=null;render();}else if(el.id==='scenario-select'){state.scenario=el.value;}else if(el.id==='role-select'){state.role=el.value;}else if(el.id==='conditional'){state.conditional=el.checked;render();}else if(el.id==='group-select'){state.group=el.value;render();}else if(el.id==='zoom-select'){state.zoom=Number(el.value);render();}else if(el.dataset.field){state.drafts[state.screen]??={};state.drafts[state.screen][el.dataset.field]=el.type==='checkbox'?el.checked:el.value;}});
document.addEventListener('input',e=>{if(e.target.dataset.field){state.drafts[state.screen]??={};state.drafts[state.screen][e.target.dataset.field]=e.target.type==='checkbox'?e.target.checked:e.target.value;}if(e.target.id==='feature-search'){const v=e.target.value,pos=e.target.selectionStart;state.featureSearch=v;render();const f=document.getElementById('feature-search');f.focus();f.setSelectionRange(pos,pos);}});
function hash(){const id=new URLSearchParams(location.hash.slice(1)).get('screen');if(id&&screen(id))go(id,{browse:true});}
const renderBase=render;
render=function(){renderBase();if(!state.trace||state.view!=='walk')live.textContent='';if(state.view!=='walk')return;const pending=state.pending;if(state.screen==='CONFIRM_ACTION'&&pending){const box=document.createElement('div');box.className='notice';box.innerHTML='<strong>'+esc(pending.action.label)+'</strong><p>'+esc(pending.action.effect)+'</p><code>'+esc(pending.action.request)+'</code><p class="small">Origin: '+esc(pending.screen)+'. No change is sent until Confirm change.</p>';document.querySelector('.phone-title').after(box);}
 const contract=state.trace?.action?.wireContract;if(contract){const box=document.createElement('details');box.innerHTML='<summary>Typed request contract</summary><p class="small">Form labels are mapped through a typed use case; never send arbitrary UI state. Selected labels resolve to authorized IDs.</p><pre>'+esc(JSON.stringify(contract,null,2))+'</pre>';document.querySelector('.trace').append(box);}
};
window.addEventListener('hashchange',hash);render();hash();
window.FeedMeBlueprint={data:D,state,go,runAction,render};
})();
